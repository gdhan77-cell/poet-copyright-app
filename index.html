<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>시인 저작권 만료일 계산기</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    label { display: block; margin-top: 1rem; }
    input { padding: 6px 8px; font-size: 1rem; width: 100%; box-sizing: border-box; }
    button { margin-top: 1.2rem; padding: 8px 14px; font-size: 1rem; cursor: pointer; }
    .result { margin-top: 1.5rem; padding: 12px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
    .note { margin-top: 0.75rem; font-size: 0.9rem; color: #555; }
  </style>
</head>
<body>
  <h1>한국 시인 저작권 만료일 계산기</h1>
  <p>시인의 사망연도를 기준으로 저작재산권 만료일과 퍼블릭 도메인 전환일을 계산합니다.</p>

  <label>
    시인 이름
    <input id="name" type="text" placeholder="예: 윤동주" />
  </label>

  <label>
    사망연도 (YYYY)
    <input id="yearOfDeath" type="number" placeholder="예: 1945" />
  </label>

  <button onclick="onCalc()">만료일 계산하기</button>

  <div id="result" class="result" style="display:none;"></div>

  <p class="note">
    * 한국 기준: 1962년까지 사망자는 보통 사후 50년, 1963년 이후 사망자는 사후 70년이 적용됩니다.
  </p>

  <script>
    function calcExpiry(yearOfDeath) {
      const startYear = yearOfDeath + 1;
      let endYear, rule;

      if (yearOfDeath <= 1962) {
        endYear = yearOfDeath + 50;
        rule = "사후 50년 (1962년까지 사망)";
      } else {
        endYear = yearOfDeath + 70;
        rule = "사후 70년 (1963년 이후 사망)";
      }

      const startDate = `${startYear}-01-01`;
      const endDate = `${endYear}-12-31`;
      const publicDomainFrom = `${endYear + 1}-01-01`;

      return { startDate, endDate, publicDomainFrom, rule };
    }

    function onCalc() {
      const name = document.getElementById("name").value.trim();
      const yearStr = document.getElementById("yearOfDeath").value.trim();
      const resultEl = document.getElementById("result");

      if (!yearStr) {
        alert("사망연도를 입력하세요.");
        return;
      }

      const year = parseInt(yearStr, 10);
      if (isNaN(year) || year < 1800 || year > 2100) {
        alert("사망연도를 올바르게 입력하세요 (예: 1945).");
        return;
      }

      const { startDate, endDate, publicDomainFrom, rule } = calcExpiry(year);

      const displayName = name || "해당 시인";
      resultEl.style.display = "block";
      resultEl.innerHTML = `
        <strong>${displayName}</strong>의 저작재산권 보호기간은 다음과 같습니다:<br/><br/>
        - 적용 기준: ${rule}<br/>
        - 보호기간 시작일: ${startDate}<br/>
        - 보호기간 종료일: ${endDate}<br/>
        - 퍼블릭 도메인 전환일: ${publicDomainFrom} 부터 자유 이용 가능
      `;
    }
  </script>
</body>
</html>
